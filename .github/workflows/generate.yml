name: Generate Japan Stock ICS
on:
  schedule:
    - cron: '0 17 * * *'  # JST 02:00
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install deps
      run: uv sync

    - name: Generate ICS
      env:
        JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      run: uv run python generate.py

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
